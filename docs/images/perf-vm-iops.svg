</style><rect class="bg" width="860" height="222" rx="8"/><text class="t1" x="24" y="34" font-size="18" font-weight="600">IOPS inside one VM on the FlashSystem 7600</text><text class="t2" x="24" y="56" font-size="13">fio, 4 jobs, queue depth 32, O_DIRECT · one virtual disk · average latency 1.0 to 1.1 ms</text><text class="t1" x="288" y="96.0" font-size="14" text-anchor="end">Random read 4K</text><rect class="s1" x="300" y="78" width="422.8" height="26" rx="4"/><text class="t1" x="730.8" y="96.0" font-size="14" font-weight="600">118,615 IOPS</text><text class="t1" x="288" y="136.0" font-size="14" text-anchor="end">Random write 4K</text><rect class="s1" x="300" y="118" width="404.4" height="26" rx="4"/><text class="t1" x="712.4" y="136.0" font-size="14" font-weight="600">113,456 IOPS</text><text class="t1" x="288" y="176.0" font-size="14" text-anchor="end">Mixed 8K 70/30 (read + write)</text><rect class="s1" x="300" y="158" width="428.6" height="26" rx="4"/><text class="t1" x="736.6" y="176.0" font-size="14" font-weight="600">120,241 IOPS</text><line class="axis" x1="300" x2="300" y1="72" y2="204" stroke-width="1"/></svg>
