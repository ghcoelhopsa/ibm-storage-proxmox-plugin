</style><rect class="bg" width="860" height="342" rx="8"/><text class="t1" x="24" y="34" font-size="18" font-weight="600">Time of storage operations seen from Proxmox</text><text class="t2" x="24" y="56" font-size="13">FlashSystem 7600, firmware 9.1.2 · volume group of the VM with two disks (20 + 120 GiB)</text><text class="t1" x="288" y="96.0" font-size="14" text-anchor="end">Create disk (100 GiB)</text><rect class="s1" x="300" y="78" width="203.0" height="26" rx="4"/><text class="t1" x="511.0" y="96.0" font-size="14" font-weight="600">2.7 s</text><text class="t1" x="288" y="136.0" font-size="14" text-anchor="end">Import cloud image (3 GiB)</text><rect class="s1" x="300" y="118" width="428.6" height="26" rx="4"/><text class="t1" x="736.6" y="136.0" font-size="14" font-weight="600">5.7 s</text><text class="t1" x="288" y="176.0" font-size="14" text-anchor="end">Snapshot of the VM (2 disks)</text><rect class="s1" x="300" y="158" width="203.0" height="26" rx="4"/><text class="t1" x="511.0" y="176.0" font-size="14" font-weight="600">2.7 s</text><text class="t1" x="288" y="216.0" font-size="14" text-anchor="end">Rollback to snapshot</text><rect class="s1" x="300" y="198" width="203.0" height="26" rx="4"/><text class="t1" x="511.0" y="216.0" font-size="14" font-weight="600">2.7 s</text><text class="t1" x="288" y="256.0" font-size="14" text-anchor="end">Delete snapshot</text><rect class="s1" x="300" y="238" width="127.8" height="26" rx="4"/><text class="t1" x="435.8" y="256.0" font-size="14" font-weight="600">1.7 s</text><text class="t1" x="288" y="296.0" font-size="14" text-anchor="end">Expand disk online</text><rect class="s1" x="300" y="278" width="172.9" height="26" rx="4"/><text class="t1" x="480.9" y="296.0" font-size="14" font-weight="600">2.3 s</text><line class="axis" x1="300" x2="300" y1="72" y2="324" stroke-width="1"/></svg>
